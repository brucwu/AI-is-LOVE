[project]
name = "ai-is-love"
version = "0.1.0"
description = "Persistent AI character runtime experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openai>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
